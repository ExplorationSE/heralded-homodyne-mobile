# HHD-Mess-Server (python -m hhd.server --config config/server.toml)
# Beispiele für Live- und gemischten Betrieb: config/server_live.toml, config/server_mixed.toml, docs/HARDWARE.md
[server]
host = "0.0.0.0"          # LAN; nur lokal/Tunnel: "127.0.0.1"
port = 8766               # GX nutzt 8765
token = ""                # Zugangscode; leer = ohne Anmeldung (nur im geschützten LAN!). Für den Tunnel Pflicht.
data_dir = "hhd_data"     # Sitzungen (je Sitzung ein Verzeichnis wie hhd.io.session)
log_dir = "logs"          # Befehlsprotokoll logs/commands.jsonl
lock_timeout_s = 300.0
status_hz = 2.0

[devices]
device_mode = "sim"       # beide Geräte: live | sim | replay
harp_mode = ""            # gemischter Betrieb: leer = device_mode, sonst live | sim | replay
digitizer_mode = ""       #   (sim und replay nicht mischbar; live mit sim oder replay erlaubt)
sim_config = "config/standard.yaml"
sim_engine = "batch"             # batch: Sitzung im Speicher; stream: Zeitscheiben (lange Sitzungen, beschränkter Speicher)
sim_record_truth = false        # nur stream: Zuordnungswahrheit je Record (truth_records.h5, hhd validate-records)
replay_dir = ""           # bei replay: Sitzungsverzeichnis
chunk_s = 0.1
speed = 1.0               # Echtzeitfaktor (sim/replay; mit Live-Gerät immer 1)
realtime = true
time_scale = 0.0          # 0 = Laufdauern wie Konfiguration
delta_T_ns = 76.1         # nominelle Verzögerung Trigger → Modenzentrum (Live-Vorschau)

[live]
live_fallback = "refuse"          # Live-Gerät fehlt: refuse (Start gesperrt) | sim (Rückfall, deutlich angezeigt)
live_pause_between_runs = false   # nach jedem Lauf auf „Weiter“ warten (Blocker/Trigger umstecken)
live_remote_start_confirm = true  # ED-8b: Start mit Live-Gerät aus der Ferne nur zweistufig
hh500_lib = ""                    # leer = $HHD_HH500LIB oder Standardorte
hh500_devidx = 0
hh500_serial = ""                 # optional: nur dieses Gerät öffnen
adq_lib = ""                      # leer = $HHD_ADQAPI oder Standardorte
adq_device_index = 0
adq_trace_dir = "logs/adq_trace"
adq_marker_capture = "channel_b_sync"   # channel_b_sync (Kanal B auf SYNC = Marker, ED-7) | channel_b_trig
adq_json_override = ""            # JSON mit zusätzlichen ADQAPI-Parametern (nach Inbetriebnahme)
adq_drain_ms = 200
# Ratenbegrenzung HydraHarp (ab 0.15): Zerlegen läuft in einem eigenen Prozess; der Grenzwert wird beim Start
# per Selbsttest gemessen (Zerlegen + Schreiben, × harp_rate_safety). Darüber Warnung, dauerhaft darüber Abbruch.
harp_max_mcps = 0.0               # > 0: fester Grenzwert in Mcps statt Selbsttest (Umgebung HHD_HARP_MAX_MCPS geht vor)
harp_rate_safety = 0.6            # Sicherheitsfaktor auf den Selbsttest
harp_rate_selftest = true         # Selbsttest beim Start (nur Live-Harp oder mit sim_harp_extra_mcps)
harp_rate_window_s = 1.0          # Mittelungsfenster der Zählrate (Messzeit)
harp_rate_stop_s = 10.0           # so lange ununterbrochen über dem Grenzwert → Lauf angehalten
split_backlog_mb = 512.0          # Rückstau vor dem Zerlege-Prozess; darüber sofortiger Abbruch
sim_harp_extra_mcps = 0.0         # nur Simulator: Testlast auf CH3 (Mcps), um die Begrenzung zu prüfen

[analysis]
auto_analyze = true
n_boot = 100
streaming_records = 200000      # Datenstrom-Auswertung (beschränkter Speicher) ab so vielen Records; 0 = nie
analysis_workers = 0            # Bootstrap-Prozesse: 0 = alle Kerne (automatisch), 1 = seriell
h5_compression = "blosc-lz4"    # digitizer.h5: blosc-lz4 (schnell, hdf5plugin) | gzip (Rückfall, ohne Plugin lesbar) | none
