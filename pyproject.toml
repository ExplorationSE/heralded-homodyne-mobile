[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heralded-homodyne-mobile"
dynamic = ["version"]
description = "Heralded Homodyne Mobile für PicoQuant HydraHarp 500 und Teledyne SP Devices ADQ32 – Simulator, Auswertung, Mess-Server und Web-App (unabhängige Software, nicht mit den Herstellern verbunden)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stefan Eilers" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py>=3.10", "pyyaml>=6.0", "hdf5plugin>=4.0", "threadpoolctl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "qrcode>=7.4"]

[project.scripts]
hhd = "hhd.cli:main"
hhd-sim = "hhd.sim.cli:main"
hhd-server = "hhd.server.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "hhd.__version__" }

[tool.setuptools.packages.find]
include = ["hhd*"]

[tool.setuptools.package-data]
"hhd.server" = ["web/*"]
"hhd.drivers.mock" = ["*.c", "*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
