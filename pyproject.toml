[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exse-harp-adq32-hhd-mobil"
dynamic = ["version"]
description = "ExSE Harp ADQ32 HHD Mobil – Heralded Homodyne: Simulator und (später) Auswertung/App"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py>=3.10", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hhd-sim = "hhd.sim.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hhd.__version__" }

[tool.setuptools.packages.find]
include = ["hhd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
